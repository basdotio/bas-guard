# SPDX-License-Identifier: MIT
# BAS Guard CI gate — drop into .github/workflows/bas-guard.yml
#
# Fails the build if any committed skill/agent artifact scans at or above `--fail-on`, and annotates
# the pull request with each finding through GitHub Code Scanning.
name: bas-guard
on: [push, pull_request]

permissions:
  contents: read
  security-events: write      # required to upload SARIF

jobs:
  agent-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: install bas-guard
        run: go install github.com/basdotio/bas-guard/cmd/bas-guard@latest

      # --root is the dir that holds your skills/, and the first line picks it. A repository of skills
      # keeps skills/ at its top level: the root is the repository (.). A project keeps its agent
      # files in .claude — skills, settings.json (hooks, permission grants), agents/, commands/ — and
      # its .mcp.json and CLAUDE.md next to it are read from there too: the root is .claude. Replace
      # the line with a fixed root if you prefer. A root that holds nothing to check, or a project's
      # .claude it did not read, exits 4 ("could not be evaluated") rather than passing.
      #
      # continue-on-error so the SARIF still uploads when the gate fails — otherwise the run you most
      # want annotations for is the one that produces none.
      - name: scan as a gate
        id: scan
        continue-on-error: true
        run: |
          root=.claude; if [ -d skills ] || [ ! -d .claude ]; then root=.; fi
          bas-guard scan --root "$root" --fail-on high --sarif bas-guard.sarif

      - name: annotate the pull request
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bas-guard.sarif

      # Re-assert the gate's verdict, now that the annotations are in.
      - name: fail if the gate failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
